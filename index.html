<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>悪魔の四目並べ 〜思考を蝕む四目の呪い〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-light:  #4a6bdc;
    --blue:        #2a45b8;
    --blue-deep:   #1a2c85;
    --blue-darkest:#111f66;

    --red-hi:      #ff9a8d;
    --red:         #ff4733;
    --red-deep:    #ba180b;

    --gold-hi:     #ffe6a3;
    --gold:        #ffb52b;
    --gold-deep:   #c27602;

    --cream:       rgba(255, 255, 255, 0.1);
    --ink:         #ffffff;
    --ink-soft:    #e3dfff;
    --current-glow: var(--red);

    color-scheme: dark;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; min-height:100%;
    font-family:'Noto Sans JP', sans-serif;
    background:
      radial-gradient(circle at 50% 15%, rgba(181, 73, 255, 0.6) 0%, transparent 40%),
      radial-gradient(ellipse at 15% 10%, rgba(255, 42, 122, 0.5) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 10%, rgba(255, 42, 122, 0.5) 0%, transparent 50%),
      linear-gradient(180deg, transparent 75%, rgba(147, 33, 168, 0.3) 85%, rgba(61, 10, 89, 0.6) 100%),
      linear-gradient(180deg, #0d0121 0%, #290a4a 30%, #3a0d5c 60%, #150029 100%);
    background-attachment: fixed;
    color:var(--ink);
    overflow-x:hidden;
  }

  .stage{
    max-width:440px;
    margin:0 auto;
    padding:28px 18px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100dvh;
  }

  h1.title{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:900;
    font-size:clamp(30px, 9vw, 42px);
    margin:0 0 4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    letter-spacing:1px;
    color: #ff9185;
    text-shadow: 0 3px 6px rgba(0,0,0,0.6);
  }

  h1.title .title-sub{
    font-size:0.38em;
    font-weight:700;
    letter-spacing:0.5px;
    color: #ffb3aa;
    margin-top:2px;
  }

  .tagline{
    margin:0 0 14px;
    font-size:13.5px;
    font-weight:500;
    color:var(--ink-soft);
    text-align:center;
    opacity:.9;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  /* ---------- Mode & settings ---------- */
  .settings-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:12px;
  }
  .mode-picker, .diff-picker, .sfx-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:999px;
    padding:6px 8px 6px 12px;
    box-shadow:0 3px 12px rgba(0,0,0,.3);
  }
  .mode-label, .diff-label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .mode-btn, .diff-btn{
    border:none;
    border-radius:999px;
    padding:5px 11px;
    font-size:12px;
    font-weight:800;
    font-family:'Noto Sans JP', sans-serif;
    cursor:pointer;
    color:rgba(255,255,255,0.55);
    background:rgba(255,255,255,0.08);
    transition:background .15s ease, color .15s ease, transform .08s ease;
  }
  .mode-btn:active, .diff-btn:active{ transform:translateY(1px); }
  .mode-btn.active, .diff-btn.active{
    background:linear-gradient(180deg, #c084fc, #9333ea 70%);
    color:#1a0533;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .mode-btn:disabled, .diff-btn:disabled{
    cursor:not-allowed;
    opacity:.45;
  }
  .sfx-toggle button{
    border:none;
    border-radius:999px;
    padding:5px 12px;
    font-size:12.5px;
    font-weight:800;
    font-family:'Noto Sans JP', sans-serif;
    cursor:pointer;
    color:rgba(255,255,255,0.55);
    background:rgba(255,255,255,0.08);
    transition:background .15s ease, color .15s ease;
  }
  .sfx-toggle button.on{
    background:linear-gradient(180deg, #86efac, #22c55e 70%);
    color:#052e16;
  }

  /* ---------- Status pill & score ---------- */
  .hud{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:16px;
  }
  .starter-picker{
    display:flex;
    align-items:center;
    gap:6px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:999px;
    padding:6px 8px 6px 14px;
    box-shadow:0 3px 12px rgba(0,0,0,.3);
  }
  .starter-label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .starter-btn{
    border:none;
    border-radius:999px;
    padding:5px 12px;
    font-size:12.5px;
    font-weight:800;
    font-family:'Noto Sans JP', sans-serif;
    cursor:pointer;
    color:rgba(255,255,255,0.6);
    background:rgba(255,255,255,0.08);
    transition:background .15s ease, color .15s ease, transform .08s ease, box-shadow .15s ease;
  }
  .starter-btn:active{ transform:translateY(1px); }
  .starter-btn:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  .starter-btn:disabled{
    cursor:not-allowed;
    opacity:.45;
  }
  .starter-btn:disabled.active{ opacity:.7; }
  .starter-btn.red.active{
    background:linear-gradient(180deg, var(--red-hi), var(--red) 70%);
    color:#3a0300;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .starter-btn.yellow.active{
    background:linear-gradient(180deg, var(--gold-hi), var(--gold) 70%);
    color:#3a2600;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .starter-btn.active:not(.red):not(.yellow){
    background:linear-gradient(180deg, #c084fc, #9333ea 70%);
    color:#1a0533;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .status-pill{
    display:flex;
    align-items:center;
    gap:8px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border:1px solid rgba(255,255,255,0.3);
    padding:8px 16px 8px 10px;
    border-radius:999px;
    font-weight:700;
    font-size:14px;
    color:var(--ink);
    box-shadow:0 3px 12px rgba(0,0,0,.3), 0 0 0 0 var(--current-glow);
    transition:box-shadow .25s ease;
  }
  .status-pill.win-state{
    box-shadow:0 3px 12px rgba(0,0,0,.3), 0 0 0 3px var(--current-glow), 0 0 18px 2px var(--current-glow);
  }
  .status-pill.cpu-thinking{
    box-shadow:0 3px 12px rgba(0,0,0,.3), 0 0 0 2px #c084fc, 0 0 12px 1px #c084fc;
  }
  .status-dot{
    width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, var(--red-hi), var(--red) 50%, var(--red-deep) 100%);
    box-shadow:0 2px 3px rgba(0,0,0,.5);
    transition:background .2s ease;
    flex:none;
  }
  .status-dot.yellow{
    background:radial-gradient(circle at 32% 28%, var(--gold-hi), var(--gold) 50%, var(--gold-deep) 100%);
  }
  .score{
    font-size:12.5px;
    font-weight:700;
    color:var(--ink);
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border:1px solid rgba(255,255,255,0.3);
    box-shadow:0 3px 12px rgba(0,0,0,.3);
    border-radius:999px;
    padding:8px 12px;
    white-space:nowrap;
  }
  .score b.sr{ color:#ff7e70; text-shadow:0 0 4px rgba(255,100,100,0.5); }
  .score b.sy{ color:#ffd866; text-shadow:0 0 4px rgba(255,200,100,0.5); }

  .score-wrap{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .score-reset-btn{
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow:0 3px 8px rgba(0,0,0,.3);
    cursor:pointer;
    flex:none;
    padding:0;
    transition:transform .08s ease;
  }
  .score-reset-btn:active{ transform:translateY(2px) scale(.92); }
  .score-reset-btn:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  .score-reset-icon{
    width:10px; height:10px;
    border:2px solid var(--ink);
    border-radius:50%;
    border-right-color:transparent;
    position:relative;
    transform:rotate(-45deg);
    flex:none;
  }
  .score-reset-icon::after{
    content:'';
    position:absolute;
    top:-3.5px; right:-2px;
    width:0; height:0;
    border-left:3.5px solid transparent;
    border-bottom:4px solid var(--ink);
    transform:rotate(25deg);
  }

  /* ---------- Board shell ---------- */
  .board-shell{
    position:relative;
    width:100%;
  }

  .board{
    position:relative;
    background:
      linear-gradient(155deg, var(--blue-light) 0%, var(--blue) 45%, var(--blue-deep) 100%);
    border-radius:22px;
    padding:14px 12px 10px;
    box-shadow:
      0 14px 0 var(--blue-darkest),
      0 22px 30px rgba(0,0,0,.6),
      inset 0 2px 0 rgba(255,255,255,.25);
  }

  .preview-row{
    display:flex;
    height:14px;
    margin-bottom:4px;
  }
  .preview-slot{
    flex:1;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .ghost{
    width:70%;
    aspect-ratio:1/1;
    max-height:100%;
    border-radius:50%;
    opacity:0;
    transform:translateY(4px) scale(.7);
    transition:opacity .15s ease, transform .15s ease;
    background:radial-gradient(circle at 32% 28%, var(--red-hi), var(--red) 60%);
  }
  .preview-slot.active .ghost{
    opacity:.75;
    transform:translateY(0) scale(1);
    box-shadow: 0 0 10px var(--red);
  }
  .preview-slot.active .ghost.yellow{
    background:radial-gradient(circle at 32% 28%, var(--gold-hi), var(--gold) 60%);
    box-shadow: 0 0 10px var(--gold);
  }

  .grid{
    position:relative;
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:clamp(4px, 1.6vw, 8px);
  }

  .cell{
    position:relative;
    aspect-ratio:1/1;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #24316f 0%, #101a4a 65%, #0b1338 100%);
    box-shadow:
      inset 0 4px 7px rgba(0,0,0,.8),
      inset 0 -2px 3px rgba(255,255,255,.1);
  }

  .piece{
    position:absolute; inset:0;
    border-radius:50%;
    opacity:0;
    transform:scale(.6);
  }
  .piece.red{
    opacity:1; transform:scale(1);
    background:radial-gradient(circle at 32% 26%, var(--red-hi) 0%, var(--red) 48%, var(--red-deep) 100%);
    box-shadow:inset 0 -4px 6px rgba(0,0,0,.4), inset 0 3px 3px rgba(255,255,255,.4), 0 2px 4px rgba(0,0,0,.5);
  }
  .piece.yellow{
    opacity:1; transform:scale(1);
    background:radial-gradient(circle at 32% 26%, var(--gold-hi) 0%, var(--gold) 48%, var(--gold-deep) 100%);
    box-shadow:inset 0 -4px 6px rgba(0,0,0,.4), inset 0 3px 3px rgba(255,255,255,.4), 0 2px 4px rgba(0,0,0,.5);
  }
  .cell.win .piece{
    animation:pulse-win 1s ease-in-out infinite;
  }
  @keyframes pulse-win{
    0%,100%{ box-shadow:inset 0 -4px 6px rgba(0,0,0,.4), inset 0 3px 3px rgba(255,255,255,.4), 0 0 0 rgba(255,255,255,0); transform:scale(1); }
    50%{ box-shadow:inset 0 -4px 6px rgba(0,0,0,.4), inset 0 3px 3px rgba(255,255,255,.6), 0 0 16px 4px rgba(255,255,255,.85); transform:scale(1.08); }
  }

  .flying-piece{
    position:absolute;
    border-radius:50%;
    z-index:5;
    pointer-events:none;
  }
  .flying-piece.red{
    background:radial-gradient(circle at 32% 26%, var(--red-hi) 0%, var(--red) 48%, var(--red-deep) 100%);
    box-shadow:inset 0 -4px 6px rgba(0,0,0,.4), inset 0 3px 3px rgba(255,255,255,.4), 0 4px 6px rgba(0,0,0,.5);
  }
  .flying-piece.yellow{
    background:radial-gradient(circle at 32% 26%, var(--gold-hi) 0%, var(--gold) 48%, var(--gold-deep) 100%);
    box-shadow:inset 0 -4px 6px rgba(0,0,0,.4), inset 0 3px 3px rgba(255,255,255,.4), 0 4px 6px rgba(0,0,0,.5);
  }

  .cols-overlay{
    position:absolute;
    left:12px; right:12px;
    top:18px; bottom:10px;
    display:flex;
  }
  .col-btn{
    flex:1;
    background:transparent;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    -webkit-appearance:none;
  }
  .col-btn:focus-visible{
    outline:3px solid rgba(255,255,255,0.5);
    outline-offset:-3px;
    border-radius:14px;
  }
  .col-btn:disabled{ cursor:default; }

  .win-line-svg{
    position:absolute; inset:0;
    width:100%; height:100%;
    overflow:visible;
    pointer-events:none;
    z-index:9;
  }
  #winLine{
    fill:none;
    stroke-linecap:round;
    opacity:0;
  }
  #winLine.show{
    opacity:1;
    animation:line-glow-pulse 1s ease-in-out .05s 3;
  }
  @keyframes line-glow-pulse{
    0%,100%{ filter:drop-shadow(0 0 3px currentColor) drop-shadow(0 0 8px currentColor); }
    50%{ filter:drop-shadow(0 0 8px currentColor) drop-shadow(0 0 18px currentColor); }
  }
  .win-dot{
    opacity:0;
    fill:#fff;
    stroke-width:3px;
    transform-box:fill-box;
    transform-origin:center;
  }
  .win-dot.show{
    animation:dot-pop .45s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes dot-pop{
    0%{ opacity:0; transform:scale(0); }
    60%{ opacity:1; transform:scale(1.35); }
    100%{ opacity:1; transform:scale(1); }
  }

  .board.shake{ animation:shake .32s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }

  .tray-wrap{
    position:relative;
    display:flex;
    justify-content:center;
    margin-top:-4px;
  }
  .tray{
    width:100%;
    max-width:340px;
    height:46px;
    background:linear-gradient(180deg, var(--blue-deep), var(--blue-darkest));
    border-radius:12px;
    box-shadow:inset 0 6px 10px rgba(0,0,0,.7), 0 8px 12px rgba(0,0,0,.5);
    position:relative;
    overflow:hidden;
  }
  .tray .rc{
    position:absolute;
    width:26px; height:26px;
    border-radius:50%;
    bottom:6px;
  }
  .tray .rc.red{ background:radial-gradient(circle at 32% 28%, var(--red-hi), var(--red) 55%, var(--red-deep) 100%); }
  .tray .rc.yellow{ background:radial-gradient(circle at 32% 28%, var(--gold-hi), var(--gold) 55%, var(--gold-deep) 100%); }

  .icon-reset-btn{
    position:fixed;
    top:16px; right:16px;
    width:46px; height:46px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, var(--gold-hi), var(--gold) 70%);
    box-shadow:0 4px 0 var(--gold-deep), 0 8px 16px rgba(0,0,0,.5);
    cursor:pointer;
    z-index:15;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .icon-reset-btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 var(--gold-deep), 0 3px 6px rgba(0,0,0,.4);
  }
  .icon-reset-btn:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
  .reset-icon{
    width:18px; height:18px;
    border:3px solid var(--blue-darkest);
    border-radius:50%;
    border-right-color:transparent;
    position:relative;
    transform:rotate(-45deg);
    flex:none;
  }
  .reset-icon::after{
    content:'';
    position:absolute;
    top:-5px; right:-3px;
    width:0; height:0;
    border-left:5px solid transparent;
    border-bottom:6px solid var(--blue-darkest);
    transform:rotate(25deg);
  }

  .confirm-overlay{
    position:fixed; inset:0;
    background:rgba(10,5,30,.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:25;
  }
  .confirm-overlay.show{ opacity:1; pointer-events:auto; }
  .confirm-card{
    background:linear-gradient(165deg, #2a164d, #140529);
    border:2px solid #5a308c;
    border-radius:20px;
    padding:26px 24px;
    text-align:center;
    max-width:300px;
    transform:scale(.9) translateY(8px);
    transition:transform .2s ease;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
  }
  .confirm-overlay.show .confirm-card{ transform:scale(1) translateY(0); }
  .confirm-text{
    font-size:16.5px;
    font-weight:700;
    margin-bottom:20px;
    color:#fff;
  }
  .confirm-actions{
    display:flex;
    gap:12px;
    justify-content:center;
  }
  .confirm-btn{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:800;
    font-size:15px;
    border:none;
    padding:11px 24px;
    border-radius:999px;
    cursor:pointer;
  }
  .confirm-btn.yes{
    background:linear-gradient(180deg, var(--gold-hi), var(--gold) 70%);
    color:var(--blue-darkest);
    box-shadow:0 4px 0 var(--gold-deep), 0 8px 12px rgba(0,0,0,.3);
  }
  .confirm-btn.no{
    background:#3f226b;
    color:#fff;
    border:1px solid #794bb3;
  }
  .confirm-btn:active{ transform:translateY(3px); }

  .win-overlay{
    position:fixed; inset:0;
    background:rgba(10,5,30,.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:20;
  }
  .win-overlay.show{ opacity:1; pointer-events:auto; }
  .win-card{
    background:linear-gradient(165deg, #2a164d, #140529);
    border:2px solid var(--gold);
    border-radius:24px;
    padding:32px 28px;
    text-align:center;
    max-width:320px;
    transform:scale(.85) translateY(10px);
    transition:transform .25s ease;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
  }
  .win-overlay.show .win-card{ transform:scale(1) translateY(0); }
  .win-emoji{ font-size:44px; margin-bottom:8px; }
  .win-text{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:900;
    font-size:24px;
    margin-bottom:22px;
    color:#fff;
  }
  .win-card button{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:800;
    font-size:15px;
    color:#fff;
    background:linear-gradient(180deg, #ff4733, #ba180b);
    border:none;
    padding:12px 28px;
    border-radius:999px;
    box-shadow:0 5px 0 #730f07, 0 10px 16px rgba(0,0,0,.4);
    cursor:pointer;
  }
  .win-card button:active{ transform:translateY(4px); box-shadow:0 1px 0 #730f07; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }
</style>
</head>
<body>

<button class="icon-reset-btn" id="iconResetBtn" aria-label="リセット" title="リセット">
  <span class="reset-icon"></span>
</button>

<div class="stage">
  <h1 class="title" id="titleText">悪魔の四目並べ<span class="title-sub">〜思考を蝕む四目の呪い〜</span></h1>
  <p class="tagline">縦・横・斜め、先に４つ並べたら勝ち！</p>

  <div class="settings-row">
    <div class="mode-picker" id="modePicker">
      <span class="mode-label">モード</span>
      <button class="mode-btn active" id="modePvpBtn" data-mode="pvp">対人</button>
      <button class="mode-btn" id="modeCpuBtn" data-mode="cpu">CPU</button>
    </div>
    <div class="mode-picker" id="firstPicker" style="display:none;">
      <span class="mode-label">先攻</span>

<script type="text/plain" id="cpuWorkerSrc">
const ROWS = 6, COLS = 7;
let board = [];

const DIRECTIONS = [ [0,1], [1,0], [1,1], [1,-1] ];

  function checkWin(row, col, player){
    for(const [dr, dc] of DIRECTIONS){
      const line = [[row,col]];
      let r = row + dr, c = col + dc;
      while(r>=0 && r<ROWS && c>=0 && c<COLS && board[r][c] === player){
        line.push([r,c]); r += dr; c += dc;
      }
      r = row - dr; c = col - dc;
      while(r>=0 && r<ROWS && c>=0 && c<COLS && board[r][c] === player){
        line.push([r,c]); r -= dr; c -= dc;
      }
      if(line.length >= 4) return line;
    }
    return null;
  }

function lowestEmptyRow(col){
    for(let r = ROWS - 1; r >= 0; r--){
      if(board[r][col] === null) return r;
    }
    return -1;
  }

function getValidCols(){
    const cols = [];
    for(let c=0; c<COLS; c++){
      if(lowestEmptyRow(c) !== -1) cols.push(c);
    }
    return cols;
  }

  function simulateDrop(col, player){
    const row = lowestEmptyRow(col);
    if(row === -1) return null;
    board[row][col] = player;
    return row;
  }

  function undoDrop(row, col){
    board[row][col] = null;
  }

  function wouldWin(col, player){
    const row = simulateDrop(col, player);
    if(row === null) return false;
    const win = checkWin(row, col, player);
    undoDrop(row, col);
    return !!win;
  }

  // Count empty cells on board
  function countEmpty(){
    let n = 0;
    for(let r=0; r<ROWS; r++)
      for(let c=0; c<COLS; c++)
        if(board[r][c] === null) n++;
    return n;
  }

  // --- Strong evaluation ---
  const CENTER_WEIGHTS = [1, 2, 3, 4, 3, 2, 1];

  function evalWindow(cells, player){
    const opp = player === 'red' ? 'yellow' : 'red';
    let my = 0, op = 0, empty = 0;
    for(let i=0; i<4; i++){
      const v = cells[i];
      if(v === player) my++;
      else if(v === opp) op++;
      else empty++;
    }
    if(my > 0 && op > 0) return 0;
    if(my === 4) return 100000;
    if(op === 4) return -100000;
    if(my === 3 && empty === 1) return 900;
    if(op === 3 && empty === 1) return -850;
    if(my === 2 && empty === 2) return 50;
    if(op === 2 && empty === 2) return -40;
    if(my === 1 && empty === 3) return 5;
    if(op === 1 && empty === 3) return -4;
    return 0;
  }

  function scorePosition(player){
    let score = 0;
    // Horizontal
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<=COLS-4; c++){
        score += evalWindow([board[r][c], board[r][c+1], board[r][c+2], board[r][c+3]], player);
      }
    }
    // Vertical
    for(let c=0; c<COLS; c++){
      for(let r=0; r<=ROWS-4; r++){
        score += evalWindow([board[r][c], board[r+1][c], board[r+2][c], board[r+3][c]], player);
      }
    }
    // Diagonal \
    for(let r=0; r<=ROWS-4; r++){
      for(let c=0; c<=COLS-4; c++){
        score += evalWindow([board[r][c], board[r+1][c+1], board[r+2][c+2], board[r+3][c+3]], player);
      }
    }
    // Diagonal /
    for(let r=3; r<ROWS; r++){
      for(let c=0; c<=COLS-4; c++){
        score += evalWindow([board[r][c], board[r-1][c+1], board[r-2][c+2], board[r-3][c+3]], player);
      }
    }
    // Center control
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<COLS; c++){
        if(board[r][c] === player) score += CENTER_WEIGHTS[c] * 3;
        else if(board[r][c] !== null) score -= CENTER_WEIGHTS[c] * 2;
      }
    }
    return score;
  }

  // Detect if player has an immediate winning column
  function getWinningCols(player){
    const wins = [];
    for(let c=0; c<COLS; c++){
      if(wouldWin(c, player)) wins.push(c);
    }
    return wins;
  }

  // Zobrist-like simple hash for transposition table
  let zobrist = null;
  function initZobrist(){
    zobrist = [];
    let s = 123456789;
    function rnd(){ s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0); }
    for(let r=0; r<ROWS; r++){
      zobrist[r] = [];
      for(let c=0; c<COLS; c++){
        zobrist[r][c] = [rnd(), rnd()]; // [red, yellow]
      }
    }
  }
  initZobrist();

  function boardHash(){
    let h = 0;
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<COLS; c++){
        const v = board[r][c];
        if(v === 'red') h ^= zobrist[r][c][0];
        else if(v === 'yellow') h ^= zobrist[r][c][1];
      }
    }
    return h >>> 0;
  }

  // Transposition table: hash -> {depth, score, flag, bestCol}
  // flag: 0 exact, 1 lower, 2 upper
  const TT_SIZE = 1 << 20; // ~1M entries
  const tt = new Array(TT_SIZE);
  function ttClear(){
    for(let i=0; i<TT_SIZE; i++) tt[i] = null;
  }

  let nodesSearched = 0;
  let searchDeadline = 0;
  let searchAborted = false;

  function orderMoves(valid, player, ttBest){
    // Lightweight ordering: TT best > center. Wins already handled at node entry.
    const scored = valid.map(col => {
      let s = (3 - Math.abs(col - 3)) * 10;
      if(col === ttBest) s += 1000000;
      return {col, s};
    });
    scored.sort((a,b) => b.s - a.s);
    return scored.map(x => x.col);
  }

  function negamax(depth, alpha, beta, player, ply){
    nodesSearched++;
    if((nodesSearched & 2047) === 0 && performance.now() > searchDeadline){
      searchAborted = true;
      return 0;
    }

    const opp = player === 'red' ? 'yellow' : 'red';
    const valid = getValidCols();
    const alphaOrig = alpha;

    // Terminal: no moves = draw
    if(valid.length === 0) return 0;

    // Immediate win available
    for(let i=0; i<valid.length; i++){
      if(wouldWin(valid[i], player)) return 1000000 - ply;
    }

    // TT probe
    const hash = boardHash();
    const tidx = hash & (TT_SIZE - 1);
    const entry = tt[tidx];
    let ttBest = -1;
    if(entry && entry.h === hash && entry.d >= depth){
      ttBest = entry.bc;
      if(entry.f === 0) return entry.s;
      if(entry.f === 1) alpha = Math.max(alpha, entry.s);
      else if(entry.f === 2) beta = Math.min(beta, entry.s);
      if(alpha >= beta) return entry.s;
    }

    if(depth === 0){
      return scorePosition(player);
    }

    const moves = orderMoves(valid, player, ttBest);
    let bestScore = -Infinity;
    let bestCol = moves[0];

    for(let i=0; i<moves.length; i++){
      const col = moves[i];
      const row = simulateDrop(col, player);
      if(row === null) continue;

      // If this move wins, no need to search deeper
      let score;
      if(checkWin(row, col, player)){
        score = 1000000 - ply;
      } else {
        score = -negamax(depth - 1, -beta, -alpha, opp, ply + 1);
      }
      undoDrop(row, col);

      if(searchAborted) return bestScore;

      if(score > bestScore){
        bestScore = score;
        bestCol = col;
      }
      if(score > alpha) alpha = score;
      if(alpha >= beta) break;
    }

    // TT store
    let flag = 0;
    if(bestScore <= alphaOrig) flag = 2; // upper
    else if(bestScore >= beta) flag = 1; // lower
    tt[tidx] = {h: hash, d: depth, s: bestScore, f: flag, bc: bestCol};

    return bestScore;
  }

  function chooseCpuCol(cpuPlayer){
    const human = cpuPlayer === 'red' ? 'yellow' : 'red';
    const valid = getValidCols();
    if(valid.length === 0) return 0;

    // 1. Instant win
    for(const col of valid){
      if(wouldWin(col, cpuPlayer)) return col;
    }
    // 2. Must block opponent win
    const oppWins = getWinningCols(human);
    if(oppWins.length === 1) return oppWins[0];
    if(oppWins.length >= 2){
      // two threats — lost if we can't block both; still block one
      return oppWins[0];
    }

    // 3. Avoid moves that give opponent an immediate win next
    // (filtered inside search via evaluation)

    const empties = countEmpty();
    // Endgame: solve completely when few moves left
    // Midgame: iterative deepening with time budget
    // (Worker runs off the main thread, so a longer budget doesn't freeze the UI.)
    const timeBudget = empties <= 12 ? 9000 : empties <= 20 ? 7000 : empties <= 30 ? 5000 : 4000;
    searchDeadline = performance.now() + timeBudget;
    searchAborted = false;
    nodesSearched = 0;
    // Note: TT is intentionally NOT cleared here — it stays warm for the
    // whole round so later moves benefit from work done on earlier ones.
    // It's reset naturally each round because a fresh worker (fresh TT) is
    // spun up whenever the board resets.

    let bestCol = valid.slice().sort((a,b) => Math.abs(a-3) - Math.abs(b-3))[0];
    let bestScore = -Infinity;

    // Max depth: solve remaining game when possible
    // Deep search: fully solve late game, depth 18 midgame
    const maxDepth = Math.min(empties, empties <= 16 ? empties : 18);

    for(let depth = 2; depth <= maxDepth; depth++){
      if(performance.now() > searchDeadline) break;
      let iterBest = bestCol;
      let iterScore = -Infinity;
      const ordered = orderMoves(valid, cpuPlayer, bestCol);

      for(const col of ordered){
        if(performance.now() > searchDeadline){ searchAborted = true; break; }
        const row = simulateDrop(col, cpuPlayer);
        if(row === null) continue;
        let score;
        if(checkWin(row, col, cpuPlayer)){
          score = 1000000;
        } else {
          score = -negamax(depth - 1, -Infinity, Infinity, human, 1);
        }
        undoDrop(row, col);
        if(searchAborted && iterScore === -Infinity){
          // keep previous depth result
          break;
        }
        if(score > iterScore){
          iterScore = score;
          iterBest = col;
        }
        // Perfect win found at this depth
        if(score >= 1000000 - 50) break;
      }

      if(!searchAborted || iterScore !== -Infinity){
        bestCol = iterBest;
        bestScore = iterScore;
      }
      // If we found a forced win, stop
      if(bestScore >= 1000000 - 100) break;
      // If forced loss at full depth, still play best effort
    }

    return bestCol;
  }

self.onmessage = function(e){
  board = e.data.board;
  const col = chooseCpuCol(e.data.cpuPlayer);
  self.postMessage({ col: col, reqId: e.data.reqId });
};
</script>

<script>
(function(){
  const ROWS = 6, COLS = 7;
  const board = Array.from({length:ROWS}, () => Array(COLS).fill(null));
  let current = 'red';
  let nextStarter = 'red';
  let roundStarted = false;
  let locked = false;
  let gameOver = false;
  let winOverlayTimer = null;
  let cpuTimer = null;
  const score = { red:0, yellow:0 };

  // Mode / SFX
  let gameMode = 'pvp'; // 'pvp' | 'cpu'
  let sfxEnabled = true;
  let humanColor = 'red'; // color the human plays in CPU mode
  let cpuFirst = false;  // if true, CPU moves first in CPU mode
  let audioCtx = null;

  // ---------- Build grid ----------
  const gridEl = document.getElementById('grid');
  const previewRowEl = document.getElementById('previewRow');
  const colsOverlayEl = document.getElementById('colsOverlay');
  const boardEl = document.getElementById('board');

  const cellEls = [];
  const pieceEls = [];

  for(let r=0; r<ROWS; r++){
    cellEls.push([]);
    pieceEls.push([]);
    for(let c=0; c<COLS; c++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      const piece = document.createElement('div');
      piece.className = 'piece';
      cell.appendChild(piece);
      gridEl.appendChild(cell);
      cellEls[r].push(cell);
      pieceEls[r].push(piece);
    }
  }

  const previewSlots = [];
  for(let c=0; c<COLS; c++){
    const slot = document.createElement('div');
    slot.className = 'preview-slot';
    const ghost = document.createElement('div');
    ghost.className = 'ghost';
    slot.appendChild(ghost);
    previewRowEl.appendChild(slot);
    previewSlots.push(slot);
  }

  const colButtons = [];
  for(let c=0; c<COLS; c++){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'col-btn';
    btn.setAttribute('aria-label', (c+1) + '列目に置く');
    btn.addEventListener('mouseenter', () => showGhost(c));
    btn.addEventListener('mouseleave', () => hideGhost(c));
    btn.addEventListener('focus', () => showGhost(c));
    btn.addEventListener('blur', () => hideGhost(c));
    btn.addEventListener('click', () => attemptDrop(c));
    colsOverlayEl.appendChild(btn);
    colButtons.push(btn);
  }

  function showGhost(c){
    if(gameOver || locked) return;
    if(gameMode === 'cpu' && current !== humanColor) return;
    const slot = previewSlots[c];
    slot.classList.add('active');
    const ghost = slot.querySelector('.ghost');
    ghost.classList.toggle('yellow', current === 'yellow');
  }
  function hideGhost(c){
    previewSlots[c].classList.remove('active');
  }

  // ---------- Decorative reserve tray ----------
  const trayEl = document.getElementById('tray');
  const trayChips = [
    {c:'yellow', x:10,  y:4,  r:-8},
    {c:'red',    x:34,  y:10, r:6},
    {c:'yellow', x:58,  y:2,  r:-4},
    {c:'yellow', x:82,  y:12, r:10},
    {c:'red',    x:106, y:5,  r:-10},
    {c:'red',    x:130, y:11, r:5},
    {c:'yellow', x:154, y:3,  r:-6},
    {c:'red',    x:178, y:9,  r:8},
  ];
  trayChips.forEach(chip => {
    const el = document.createElement('div');
    el.className = 'rc ' + chip.c;
    el.style.left = chip.x + 'px';
    el.style.transform = `rotate(${chip.r}deg)`;
    el.style.marginBottom = chip.y + 'px';
    trayEl.appendChild(el);
  });

  // ---------- Status / score ----------
  const statusPill = document.getElementById('statusPill');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const scoreEl = document.getElementById('score');

  function updateStatus(){
    statusDot.classList.toggle('yellow', current === 'yellow');
    statusPill.classList.remove('cpu-thinking');
    if(gameMode === 'cpu' && current !== humanColor && !gameOver){
      // 「思考中」は実際に探索中（locked）のときだけ
      if(locked){
        statusText.textContent = 'CPU思考中…';
        statusPill.classList.add('cpu-thinking');
      } else {
        statusText.textContent = 'CPUの番';
      }
    } else {
      statusText.textContent = current === 'red' ? '赤の番' : '黄の番';
    }
    statusPill.style.setProperty('--current-glow', current === 'red' ? 'var(--red)' : 'var(--gold)');
  }
  function updateScore(){
    scoreEl.innerHTML = `赤 <b class="sr">${score.red}</b> ー 黄 <b class="sy">${score.yellow}</b>`;
  }
  updateStatus();

  // ---------- Audio (Web Audio API) ----------
  function ensureAudio(){
    if(!audioCtx){
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e){ audioCtx = null; }
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, duration, type, vol, detune){
    if(!sfxEnabled || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    if(detune) osc.detune.value = detune;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playDropSound(){
    ensureAudio();
    if(!sfxEnabled || !audioCtx) return;
    // soft thud
    playTone(120, 0.12, 'sine', 0.22);
    setTimeout(() => playTone(80, 0.18, 'triangle', 0.12), 40);
    // short click
    setTimeout(() => playTone(220, 0.05, 'square', 0.06), 80);
  }

  function playBounceSound(){
    ensureAudio();
    if(!sfxEnabled || !audioCtx) return;
    playTone(180, 0.06, 'sine', 0.08);
  }

  function playInvalidSound(){
    ensureAudio();
    if(!sfxEnabled || !audioCtx) return;
    playTone(90, 0.15, 'sawtooth', 0.1);
    setTimeout(() => playTone(70, 0.2, 'sawtooth', 0.08), 80);
  }

  function playWinSound(){
    ensureAudio();
    if(!sfxEnabled || !audioCtx) return;
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => {
      setTimeout(() => playTone(f, 0.35, 'sine', 0.18), i * 90);
    });
    setTimeout(() => {
      playTone(1318.5, 0.5, 'triangle', 0.12);
    }, 400);
  }

  function playDrawSound(){
    ensureAudio();
    if(!sfxEnabled || !audioCtx) return;
    playTone(300, 0.25, 'triangle', 0.12);
    setTimeout(() => playTone(250, 0.3, 'triangle', 0.1), 150);
  }

  // ---------- Vibration ----------
  function vibrate(pattern){
    if(!sfxEnabled) return;
    if(navigator.vibrate){
      try { navigator.vibrate(pattern); } catch(e){}
    }
  }

  // ---------- Drop logic ----------
  function lowestEmptyRow(col){
    for(let r = ROWS - 1; r >= 0; r--){
      if(board[r][col] === null) return r;
    }
    return -1;
  }

  function attemptDrop(col){
    if(gameOver || locked) return;
    // CPU first: ignore board taps (use start dialog instead)
    if(gameMode === 'cpu' && current !== humanColor){
      if(!roundStarted && isBoardEmpty()){
        showCpuStartDialog();
      }
      return;
    }
    const row = lowestEmptyRow(col);
    if(row === -1){
      boardEl.classList.remove('shake');
      void boardEl.offsetWidth;
      boardEl.classList.add('shake');
      playInvalidSound();
      vibrate([30, 40, 30]);
      return;
    }
    hideGhost(col);
    dropPiece(row, col);
  }

  function dropPiece(row, col){
    if(!roundStarted){
      roundStarted = true;
      setStarterPickerEnabled(false);
      setModePickerEnabled(false);
    }
    locked = true;
    const player = current;
    board[row][col] = player;

    playDropSound();
    vibrate(25);

    const boardRect = boardEl.getBoundingClientRect();
    const slotRect = previewSlots[col].getBoundingClientRect();
    const targetRect = cellEls[row][col].getBoundingClientRect();

    const size = targetRect.width;
    const startTop = slotRect.top - boardRect.top;
    const endTop = targetRect.top - boardRect.top;
    const left = targetRect.left - boardRect.left;

    const flyer = document.createElement('div');
    flyer.className = 'flying-piece ' + player;
    flyer.style.width = size + 'px';
    flyer.style.height = size + 'px';
    flyer.style.left = left + 'px';
    flyer.style.top = startTop + 'px';
    boardEl.appendChild(flyer);

    const distance = endTop - startTop;
    const duration = Math.min(800, Math.max(450, distance * 1.3));
    const bounceHeight = size * 0.55;

    const anim = flyer.animate([
      { transform: 'translateY(0)', offset: 0, easing: 'cubic-bezier(0.55, 0.085, 0.68, 0.53)' },
      { transform: `translateY(${distance}px)`, offset: 0.55, easing: 'cubic-bezier(0, 0, 0.2, 1)' },
      { transform: `translateY(${distance - bounceHeight}px)`, offset: 0.72, easing: 'cubic-bezier(0.55, 0.085, 0.68, 0.53)' },
      { transform: `translateY(${distance}px)`, offset: 0.86, easing: 'cubic-bezier(0, 0, 0.2, 1)' },
      { transform: `translateY(${distance - bounceHeight * 0.25}px)`, offset: 0.94, easing: 'cubic-bezier(0.55, 0.085, 0.68, 0.53)' },
      { transform: `translateY(${distance}px)`, offset: 1 }
    ], { duration, fill:'forwards' });

    // bounce sound cues
    setTimeout(() => { playBounceSound(); vibrate(12); }, duration * 0.55);
    setTimeout(() => { playBounceSound(); }, duration * 0.86);

    anim.onfinish = () => {
      flyer.remove();
      const pieceEl = pieceEls[row][col];
      pieceEl.classList.add(player);
      finishTurn(row, col, player);
    };
  }

  // ---------- Win detection ----------
  const DIRECTIONS = [ [0,1], [1,0], [1,1], [1,-1] ];

  function checkWin(row, col, player){
    for(const [dr, dc] of DIRECTIONS){
      const line = [[row,col]];
      let r = row + dr, c = col + dc;
      while(r>=0 && r<ROWS && c>=0 && c<COLS && board[r][c] === player){
        line.push([r,c]); r += dr; c += dc;
      }
      r = row - dr; c = col - dc;
      while(r>=0 && r<ROWS && c>=0 && c<COLS && board[r][c] === player){
        line.push([r,c]); r -= dr; c -= dc;
      }
      if(line.length >= 4) return line;
    }
    return null;
  }

  function boardFull(){
    return board.every(row => row.every(cell => cell !== null));
  }

  // ---------- Win line ----------
  const winLineEl = document.getElementById('winLine');
  const winDotStart = document.getElementById('winDotStart');
  const winDotEnd = document.getElementById('winDotEnd');

  function cellCenter(row, col){
    const rect = cellEls[row][col].getBoundingClientRect();
    const boardRect = boardEl.getBoundingClientRect();
    return {
      x: rect.left + rect.width / 2 - boardRect.left,
      y: rect.top + rect.height / 2 - boardRect.top
    };
  }

  function drawWinLine(line, player){
    const [r1, c1] = line[0];
    const [r2, c2] = line[line.length - 1];
    const p1 = cellCenter(r1, c1);
    const p2 = cellCenter(r2, c2);
    const color = player === 'red' ? '#ff5a4d' : '#ffd24d';
    const length = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;

    winLineEl.setAttribute('x1', p1.x);
    winLineEl.setAttribute('y1', p1.y);
    winLineEl.setAttribute('x2', p2.x);
    winLineEl.setAttribute('y2', p2.y);
    winLineEl.style.stroke = color;
    winLineEl.style.color = color;
    winLineEl.style.strokeWidth = '9';
    winLineEl.style.strokeDasharray = length;
    winLineEl.style.strokeDashoffset = length;
    winLineEl.style.opacity = '1';

    winDotStart.setAttribute('cx', p1.x);
    winDotStart.setAttribute('cy', p1.y);
    winDotStart.setAttribute('r', 8);
    winDotStart.style.stroke = color;
    winDotEnd.setAttribute('cx', p2.x);
    winDotEnd.setAttribute('cy', p2.y);
    winDotEnd.setAttribute('r', 8);
    winDotEnd.style.stroke = color;

    requestAnimationFrame(() => {
      const anim = winLineEl.animate(
        [{ strokeDashoffset: length }, { strokeDashoffset: 0 }],
        { duration: 480, easing: 'ease-out', fill: 'forwards' }
      );
      anim.onfinish = () => {
        winLineEl.classList.add('show');
        winDotStart.classList.add('show');
        winDotEnd.classList.add('show');
      };
    });
  }

  function resetWinLine(){
    winLineEl.classList.remove('show');
    winLineEl.style.opacity = '0';
    winDotStart.classList.remove('show');
    winDotEnd.classList.remove('show');
  }

  function finishTurn(row, col, player){
    const winLine = checkWin(row, col, player);
    if(winLine){
      gameOver = true;
      winLine.forEach(([r,c]) => cellEls[r][c].classList.add('win'));
      statusPill.classList.add('win-state');
      score[player]++;
      updateScore();
      drawWinLine(winLine, player);
      playWinSound();
      vibrate([40, 60, 40, 60, 80]);
      roundStarted = false;
      setStarterPickerEnabled(true);
      setModePickerEnabled(true);
      locked = false;
      winOverlayTimer = setTimeout(() => showWinOverlay(player), 800);
      return;
    }
    if(boardFull()){
      gameOver = true;
      playDrawSound();
      vibrate([50, 30, 50]);
      showWinOverlay(null);
      roundStarted = false;
      setStarterPickerEnabled(true);
      setModePickerEnabled(true);
      locked = false;
      return;
    }
    current = current === 'red' ? 'yellow' : 'red';
    updateStatus();
    locked = false;

    // CPU turn
    if(gameMode === 'cpu' && current !== humanColor && !gameOver){
      scheduleCpuMove();
    }
  }

  // ---------- CPU AI (runs in a Web Worker so the UI never freezes) ----------
  // Search algorithm, evaluation weights and time budget are byte-for-byte
  // identical to before -- only where it executes has changed, so CPU
  // strength is unaffected. See the #cpuWorkerSrc script block below.
  let cpuWorker = null;
  let cpuReqId = 0;
  let workerUsable = true; // flips to false permanently if the worker fails once

  function createCpuWorker(){
    if(cpuWorker) return cpuWorker;
    const src = document.getElementById('cpuWorkerSrc').textContent;
    const blob = new Blob([src], { type: 'application/javascript' });
    cpuWorker = new Worker(URL.createObjectURL(blob));
    return cpuWorker;
  }

  function killCpuWorker(){
    if(cpuWorker){
      cpuWorker.terminate();
      cpuWorker = null;
    }
  }

  // ---------- Fallback: identical AI, run synchronously on the main thread ----------
  // Used automatically if Web Workers are unavailable or blocked in this
  // environment (e.g. some sandboxed previews). Same algorithm as the
  // worker copy, so CPU strength doesn't change -- it just won't be as
  // smooth (the page may pause briefly while it thinks).
  function getValidCols(){
    const cols = [];
    for(let c=0; c<COLS; c++){
      if(lowestEmptyRow(c) !== -1) cols.push(c);
    }
    return cols;
  }

  function simulateDrop(col, player){
    const row = lowestEmptyRow(col);
    if(row === -1) return null;
    board[row][col] = player;
    return row;
  }

  function undoDrop(row, col){
    board[row][col] = null;
  }

  function wouldWin(col, player){
    const row = simulateDrop(col, player);
    if(row === null) return false;
    const win = checkWin(row, col, player);
    undoDrop(row, col);
    return !!win;
  }

  function countEmpty(){
    let n = 0;
    for(let r=0; r<ROWS; r++)
      for(let c=0; c<COLS; c++)
        if(board[r][c] === null) n++;
    return n;
  }

  const CENTER_WEIGHTS = [1, 2, 3, 4, 3, 2, 1];

  function evalWindow(cells, player){
    const opp = player === 'red' ? 'yellow' : 'red';
    let my = 0, op = 0, empty = 0;
    for(let i=0; i<4; i++){
      const v = cells[i];
      if(v === player) my++;
      else if(v === opp) op++;
      else empty++;
    }
    if(my > 0 && op > 0) return 0;
    if(my === 4) return 100000;
    if(op === 4) return -100000;
    if(my === 3 && empty === 1) return 900;
    if(op === 3 && empty === 1) return -850;
    if(my === 2 && empty === 2) return 50;
    if(op === 2 && empty === 2) return -40;
    if(my === 1 && empty === 3) return 5;
    if(op === 1 && empty === 3) return -4;
    return 0;
  }

  function scorePosition(player){
    let score = 0;
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<=COLS-4; c++){
        score += evalWindow([board[r][c], board[r][c+1], board[r][c+2], board[r][c+3]], player);
      }
    }
    for(let c=0; c<COLS; c++){
      for(let r=0; r<=ROWS-4; r++){
        score += evalWindow([board[r][c], board[r+1][c], board[r+2][c], board[r+3][c]], player);
      }
    }
    for(let r=0; r<=ROWS-4; r++){
      for(let c=0; c<=COLS-4; c++){
        score += evalWindow([board[r][c], board[r+1][c+1], board[r+2][c+2], board[r+3][c+3]], player);
      }
    }
    for(let r=3; r<ROWS; r++){
      for(let c=0; c<=COLS-4; c++){
        score += evalWindow([board[r][c], board[r-1][c+1], board[r-2][c+2], board[r-3][c+3]], player);
      }
    }
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<COLS; c++){
        if(board[r][c] === player) score += CENTER_WEIGHTS[c] * 3;
        else if(board[r][c] !== null) score -= CENTER_WEIGHTS[c] * 2;
      }
    }
    return score;
  }

  function getWinningCols(player){
    const wins = [];
    for(let c=0; c<COLS; c++){
      if(wouldWin(c, player)) wins.push(c);
    }
    return wins;
  }

  let fbZobrist = null;
  function initFbZobrist(){
    fbZobrist = [];
    let s = 123456789;
    function rnd(){ s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0); }
    for(let r=0; r<ROWS; r++){
      fbZobrist[r] = [];
      for(let c=0; c<COLS; c++){
        fbZobrist[r][c] = [rnd(), rnd()];
      }
    }
  }
  initFbZobrist();

  function fbBoardHash(){
    let h = 0;
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<COLS; c++){
        const v = board[r][c];
        if(v === 'red') h ^= fbZobrist[r][c][0];
        else if(v === 'yellow') h ^= fbZobrist[r][c][1];
      }
    }
    return h >>> 0;
  }

  const FB_TT_SIZE = 1 << 20;
  const fbTt = new Array(FB_TT_SIZE);
  function fbTtClear(){
    for(let i=0; i<FB_TT_SIZE; i++) fbTt[i] = null;
  }

  let fbNodesSearched = 0;
  let fbSearchDeadline = 0;
  let fbSearchAborted = false;

  function fbOrderMoves(valid, player, ttBest){
    const scored = valid.map(col => {
      let s = (3 - Math.abs(col - 3)) * 10;
      if(col === ttBest) s += 1000000;
      return {col, s};
    });
    scored.sort((a,b) => b.s - a.s);
    return scored.map(x => x.col);
  }

  function fbNegamax(depth, alpha, beta, player, ply){
    fbNodesSearched++;
    if((fbNodesSearched & 2047) === 0 && performance.now() > fbSearchDeadline){
      fbSearchAborted = true;
      return 0;
    }
    const opp = player === 'red' ? 'yellow' : 'red';
    const valid = getValidCols();
    const alphaOrig = alpha;
    if(valid.length === 0) return 0;
    for(let i=0; i<valid.length; i++){
      if(wouldWin(valid[i], player)) return 1000000 - ply;
    }
    const hash = fbBoardHash();
    const tidx = hash & (FB_TT_SIZE - 1);
    const entry = fbTt[tidx];
    let ttBest = -1;
    if(entry && entry.h === hash && entry.d >= depth){
      ttBest = entry.bc;
      if(entry.f === 0) return entry.s;
      if(entry.f === 1) alpha = Math.max(alpha, entry.s);
      else if(entry.f === 2) beta = Math.min(beta, entry.s);
      if(alpha >= beta) return entry.s;
    }
    if(depth === 0){
      return scorePosition(player);
    }
    const moves = fbOrderMoves(valid, player, ttBest);
    let bestScore = -Infinity;
    let bestCol = moves[0];
    for(let i=0; i<moves.length; i++){
      const col = moves[i];
      const row = simulateDrop(col, player);
      if(row === null) continue;
      let score;
      if(checkWin(row, col, player)){
        score = 1000000 - ply;
      } else {
        score = -fbNegamax(depth - 1, -beta, -alpha, opp, ply + 1);
      }
      undoDrop(row, col);
      if(fbSearchAborted) return bestScore;
      if(score > bestScore){
        bestScore = score;
        bestCol = col;
      }
      if(score > alpha) alpha = score;
      if(alpha >= beta) break;
    }
    let flag = 0;
    if(bestScore <= alphaOrig) flag = 2;
    else if(bestScore >= beta) flag = 1;
    fbTt[tidx] = {h: hash, d: depth, s: bestScore, f: flag, bc: bestCol};
    return bestScore;
  }

  function chooseCpuColSync(cpuPlayer){
    const human = cpuPlayer === 'red' ? 'yellow' : 'red';
    const valid = getValidCols();
    if(valid.length === 0) return 0;

    for(const col of valid){
      if(wouldWin(col, cpuPlayer)) return col;
    }
    const oppWins = getWinningCols(human);
    if(oppWins.length === 1) return oppWins[0];
    if(oppWins.length >= 2){
      return oppWins[0];
    }

    const empties = countEmpty();
    const timeBudget = empties <= 14 ? 3500 : empties <= 22 ? 2500 : 2000;
    fbSearchDeadline = performance.now() + timeBudget;
    fbSearchAborted = false;
    fbNodesSearched = 0;
    fbTtClear();

    let bestCol = valid.slice().sort((a,b) => Math.abs(a-3) - Math.abs(b-3))[0];
    let bestScore = -Infinity;
    const maxDepth = Math.min(empties, empties <= 16 ? empties : 14);

    for(let depth = 2; depth <= maxDepth; depth++){
      if(performance.now() > fbSearchDeadline) break;
      let iterBest = bestCol;
      let iterScore = -Infinity;
      const ordered = fbOrderMoves(valid, cpuPlayer, bestCol);

      for(const col of ordered){
        if(performance.now() > fbSearchDeadline){ fbSearchAborted = true; break; }
        const row = simulateDrop(col, cpuPlayer);
        if(row === null) continue;
        let score;
        if(checkWin(row, col, cpuPlayer)){
          score = 1000000;
        } else {
          score = -fbNegamax(depth - 1, -Infinity, Infinity, human, 1);
        }
        undoDrop(row, col);
        if(fbSearchAborted && iterScore === -Infinity){
          break;
        }
        if(score > iterScore){
          iterScore = score;
          iterBest = col;
        }
        if(score >= 1000000 - 50) break;
      }

      if(!fbSearchAborted || iterScore !== -Infinity){
        bestCol = iterBest;
        bestScore = iterScore;
      }
      if(bestScore >= 1000000 - 100) break;
    }

    return bestCol;
  }

  // Final safety net: re-check the chosen column against the ACTUAL live
  // board right before it's applied. If a mandatory win/block was somehow
  // missed (stale snapshot, timing edge case, etc.) this corrects it.
  function pickSafeColumn(proposedCol, cpuPlayer){
    const human = cpuPlayer === 'red' ? 'yellow' : 'red';
    const valid = getValidCols();
    if(valid.length === 0) return proposedCol;
    let col = valid.indexOf(proposedCol) !== -1 ? proposedCol : valid[0];

    for(const c of valid){
      if(wouldWin(c, cpuPlayer)) return c;
    }
    const humanWins = valid.filter(c => wouldWin(c, human));
    if(humanWins.length > 0 && humanWins.indexOf(col) === -1){
      return humanWins[0];
    }
    return col;
  }

  function runCpuMoveSync(cpuPlayer){
    const col = pickSafeColumn(chooseCpuColSync(cpuPlayer), cpuPlayer);
    const row = lowestEmptyRow(col);
    if(row !== -1){
      dropPiece(row, col);
    } else {
      locked = false;
    }
  }

  function scheduleCpuMove(){
    locked = true;
    updateStatus();
    // Brief delay so "CPU思考中" paints, then deep search (off the main thread if possible)
    const thinkTime = 80;
    cpuTimer = setTimeout(() => {
      cpuTimer = null;
      if(gameOver){ locked = false; return; }
      const cpuPlayer = current;

      if(!workerUsable || typeof Worker === 'undefined'){
        runCpuMoveSync(cpuPlayer);
        return;
      }

      let worker;
      try{
        worker = createCpuWorker();
      }catch(err){
        workerUsable = false;
        runCpuMoveSync(cpuPlayer);
        return;
      }

      const reqId = ++cpuReqId;
      const boardSnapshot = board.map(row => row.slice());
      let settled = false;

      // Safety timeout: if the worker never answers (e.g. blocked by the
      // preview environment), fall back to the synchronous AI instead of
      // leaving the CPU stuck forever. Kept comfortably above the worker's
      // own max thinking budget (9s) so a legitimately long search doesn't
      // get mistaken for a stuck/blocked worker.
      const stuckTimer = setTimeout(() => {
        if(settled) return;
        settled = true;
        workerUsable = false;
        killCpuWorker();
        if(gameOver || gameMode !== 'cpu' || current !== cpuPlayer) return;
        runCpuMoveSync(cpuPlayer);
      }, 13000);

      worker.onerror = () => {
        if(settled) return;
        settled = true;
        clearTimeout(stuckTimer);
        workerUsable = false;
        killCpuWorker();
        if(gameOver || gameMode !== 'cpu' || current !== cpuPlayer) return;
        runCpuMoveSync(cpuPlayer);
      };

      worker.onmessage = (e) => {
        if(e.data.reqId !== reqId) return; // stale response from a cancelled think — ignore
        settled = true;
        clearTimeout(stuckTimer);
        if(gameOver || gameMode !== 'cpu' || current !== cpuPlayer){ return; }
        const col = pickSafeColumn(e.data.col, cpuPlayer);
        const row = lowestEmptyRow(col);
        if(row !== -1){
          dropPiece(row, col);
        } else {
          locked = false;
        }
      };

      try{
        worker.postMessage({ board: boardSnapshot, cpuPlayer, reqId });
      }catch(err){
        settled = true;
        clearTimeout(stuckTimer);
        workerUsable = false;
        killCpuWorker();
        runCpuMoveSync(cpuPlayer);
      }
    }, thinkTime);
  }

  // ---------- Win overlay ----------
  const winOverlay = document.getElementById('winOverlay');
  const winEmoji = document.getElementById('winEmoji');
  const winText = document.getElementById('winText');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const confirmOverlay = document.getElementById('confirmOverlay');

  function showWinOverlay(player){
    if(player === null){
      winEmoji.textContent = '🤝';
      winText.textContent = '引き分け！';
    } else if(player === 'red'){
      winEmoji.textContent = '🔴🎉';
      winText.textContent = gameMode === 'cpu' && humanColor === 'red' ? 'あなたの勝ち！' :
                            gameMode === 'cpu' ? 'CPUの勝ち…' : '赤の勝ち！';
    } else {
      winEmoji.textContent = '🟡🎉';
      winText.textContent = gameMode === 'cpu' && humanColor === 'yellow' ? 'あなたの勝ち！' :
                            gameMode === 'cpu' ? 'CPUの勝ち…' : '黄の勝ち！';
    }
    winOverlay.classList.add('show');
  }
  function hideWinOverlay(){
    winOverlay.classList.remove('show');
  }

  // ---------- Reset ----------
  function computeNextStarter(){
    if(gameMode === 'cpu'){
      nextStarter = cpuFirst
        ? (humanColor === 'red' ? 'yellow' : 'red')
        : humanColor;
    }
    // pvp: nextStarter is set directly by color buttons
  }

  function isBoardEmpty(){
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<COLS; c++){
        if(board[r][c] !== null) return false;
      }
    }
    return true;
  }

  function softClearBoard(){
    if(cpuTimer){ clearTimeout(cpuTimer); cpuTimer = null; }
    if(winOverlayTimer){ clearTimeout(winOverlayTimer); winOverlayTimer = null; }
    killCpuWorker();
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<COLS; c++){
        board[r][c] = null;
        pieceEls[r][c].className = 'piece';
        cellEls[r][c].classList.remove('win');
      }
    }
    gameOver = false;
    locked = false;
    roundStarted = false;
    resetWinLine();
    hideWinOverlay();
    statusPill.classList.remove('win-state', 'cpu-thinking');
  }

  function syncStarterUI(){
    const label = document.getElementById('starterLabel');
    const firstPicker = document.getElementById('firstPicker');
    const redBtn = document.getElementById('starterRedBtn');
    const yellowBtn = document.getElementById('starterYellowBtn');
    const firstHumanBtn = document.getElementById('firstHumanBtn');
    const firstCpuBtn = document.getElementById('firstCpuBtn');

    if(gameMode === 'cpu'){
      label.textContent = '自分';
      firstPicker.style.display = '';
    } else {
      label.textContent = '先行';
      firstPicker.style.display = 'none';
    }

    if(gameMode === 'pvp'){
      redBtn.classList.toggle('active', nextStarter === 'red');
      yellowBtn.classList.toggle('active', nextStarter === 'yellow');
    } else {
      redBtn.classList.toggle('active', humanColor === 'red');
      yellowBtn.classList.toggle('active', humanColor === 'yellow');
    }
    redBtn.setAttribute('aria-pressed', redBtn.classList.contains('active') ? 'true' : 'false');
    yellowBtn.setAttribute('aria-pressed', yellowBtn.classList.contains('active') ? 'true' : 'false');

    firstHumanBtn.classList.toggle('active', !cpuFirst);
    firstCpuBtn.classList.toggle('active', cpuFirst);
    firstHumanBtn.setAttribute('aria-pressed', !cpuFirst ? 'true' : 'false');
    firstCpuBtn.setAttribute('aria-pressed', cpuFirst ? 'true' : 'false');
  }

  // Apply settings without starting CPU automatically.
  function applyStarterToCurrent(){
    computeNextStarter();
    if(!roundStarted){
      if(cpuTimer){ clearTimeout(cpuTimer); cpuTimer = null; }
      current = nextStarter;
      locked = false;
      updateStatus();
    }
  }

  const cpuStartOverlay = document.getElementById('cpuStartOverlay');

  function showCpuStartDialog(){
    if(gameMode !== 'cpu' || cpuFirst !== true) return;
    if(roundStarted || gameOver) return;
    computeNextStarter();
    current = nextStarter;
    updateStatus();
    cpuStartOverlay.classList.add('show');
  }

  function hideCpuStartDialog(){
    cpuStartOverlay.classList.remove('show');
  }

  function beginCpuFirstGame(){
    hideCpuStartDialog();
    if(gameMode !== 'cpu' || !cpuFirst) return;
    softClearBoard();
    computeNextStarter();
    current = nextStarter;
    locked = false;
    updateStatus();
    if(current !== humanColor){
      scheduleCpuMove();
    }
  }

  function cancelCpuStartDialog(){
    hideCpuStartDialog();
    // stay on settings: force human-first so user can freely adjust
    // (keep cpuFirst selection but don't start)
    if(cpuTimer){ clearTimeout(cpuTimer); cpuTimer = null; }
    killCpuWorker();
    locked = false;
    roundStarted = false;
    updateStatus();
  }

  // After win / continue: if CPU first, show dialog instead of auto-starting
  function promptOrStartCpu(){
    if(gameMode === 'cpu' && cpuFirst && !gameOver && !roundStarted && isBoardEmpty()){
      showCpuStartDialog();
    }
  }

  function resetGame(){
    if(winOverlayTimer){ clearTimeout(winOverlayTimer); winOverlayTimer = null; }
    hideCpuStartDialog();
    softClearBoard();
    computeNextStarter();
    current = nextStarter;
    setStarterPickerEnabled(true);
    setModePickerEnabled(true);
    updateStatus();
    promptOrStartCpu();
  }

  function resetScore(){
    score.red = 0;
    score.yellow = 0;
    updateScore();
  }

  const confirmText = document.getElementById('confirmText');
  const scoreResetBtn = document.getElementById('scoreResetBtn');
  const starterRedBtn = document.getElementById('starterRedBtn');
  const starterYellowBtn = document.getElementById('starterYellowBtn');
  let pendingAction = 'board';

  function setHumanOrStarterColor(color){
    if(roundStarted) return;
    // changing options clears the board so settings always apply cleanly
    softClearBoard();
    if(gameMode === 'cpu'){
      humanColor = color;
    } else {
      nextStarter = color;
      humanColor = color;
    }
    syncStarterUI();
    applyStarterToCurrent();
    // do NOT auto-start CPU here — user must reset/continue or we wait
    // if CPU first, they can tap a column to kick off (handled in attemptDrop)
  }

  starterRedBtn.addEventListener('click', () => setHumanOrStarterColor('red'));
  starterYellowBtn.addEventListener('click', () => setHumanOrStarterColor('yellow'));

  document.getElementById('firstHumanBtn').addEventListener('click', () => {
    if(roundStarted) return;
    hideCpuStartDialog();
    softClearBoard();
    cpuFirst = false;
    syncStarterUI();
    applyStarterToCurrent();
  });
  document.getElementById('firstCpuBtn').addEventListener('click', () => {
    if(roundStarted) return;
    softClearBoard();
    cpuFirst = true;
    syncStarterUI();
    applyStarterToCurrent();
    showCpuStartDialog();
  });

  function setStarterPickerEnabled(enabled){
    starterRedBtn.disabled = !enabled;
    starterYellowBtn.disabled = !enabled;
    document.getElementById('firstHumanBtn').disabled = !enabled;
    document.getElementById('firstCpuBtn').disabled = !enabled;
  }

  function setModePickerEnabled(enabled){
    document.getElementById('modePvpBtn').disabled = !enabled;
    document.getElementById('modeCpuBtn').disabled = !enabled;
  }

  // Mode buttons
  document.getElementById('modePvpBtn').addEventListener('click', () => {
    if(roundStarted) return;
    hideCpuStartDialog();
    softClearBoard();
    gameMode = 'pvp';
    document.getElementById('modePvpBtn').classList.add('active');
    document.getElementById('modeCpuBtn').classList.remove('active');
    nextStarter = humanColor;
    syncStarterUI();
    applyStarterToCurrent();
  });
  document.getElementById('modeCpuBtn').addEventListener('click', () => {
    if(roundStarted) return;
    softClearBoard();
    gameMode = 'cpu';
    document.getElementById('modeCpuBtn').classList.add('active');
    document.getElementById('modePvpBtn').classList.remove('active');
    syncStarterUI();
    applyStarterToCurrent();
    if(cpuFirst) showCpuStartDialog();
  });

  document.getElementById('cpuStartOk').addEventListener('click', beginCpuFirstGame);
  document.getElementById('cpuStartCancel').addEventListener('click', () => {
    cancelCpuStartDialog();
  });

  function openConfirm(action, text){
    pendingAction = action;
    confirmText.textContent = text;
    confirmOverlay.classList.add('show');
  }

  document.getElementById('confirmYes').addEventListener('click', () => {
    confirmOverlay.classList.remove('show');
    if(pendingAction === 'score'){
      resetScore();
    } else {
      resetGame();
    }
  });
  document.getElementById('confirmNo').addEventListener('click', () => {
    confirmOverlay.classList.remove('show');
  });
  document.getElementById('iconResetBtn').addEventListener('click', () => {
    openConfirm('board', '盤面をリセットしますか？');
  });
  scoreResetBtn.addEventListener('click', () => {
    openConfirm('score', '戦績をリセットしますか？');
  });
  playAgainBtn.addEventListener('click', resetGame);

  // initial UI sync
  syncStarterUI();
  applyStarterToCurrent();

  // unlock audio on first interaction
  document.body.addEventListener('click', () => ensureAudio(), { once: true });
  document.body.addEventListener('touchstart', () => ensureAudio(), { once: true });

})();
</script>
</body>
</html>
